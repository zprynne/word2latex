[project]
name = "word2latex"
version = "0.1.0"
description = "Offline handwritten-notes to LaTeX converter"
requires-python = ">=3.10"
dependencies = ["pillow>=10.0"]

[project.scripts]
w2l = "word2latex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/word2latex"]
